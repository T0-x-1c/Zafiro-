<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zafiro</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script
        defer
        src="https://cdn.jsdelivr.net/npm/@alpinejs/csp@3.x.x/dist/cdn.min.js">
    </script>

</head>

<body>

    <!-- navbar -->
    <div id="navbar"></div>

    <div id="slider"></div>
    
    <section class="text-gray-600 body-font">
        <div class="container px-5 py-12 mx-auto lg:py-20">
            <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-gray-500">Каталог</p>
                    <h1 class="mt-1 text-3xl font-light text-gray-900">Годинники</h1>
                </div>

                <button id="filters-toggle" type="button"
                    class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition hover:bg-gray-50 lg:hidden"
                    aria-expanded="false" aria-controls="filters-panel">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h18M6 12h12m-8 7h4" />
                    </svg>
                    Фільтри
                </button>
            </div>

            <div class="flex flex-col gap-8 lg:flex-row lg:items-start">
                <aside id="filters-panel"
                    class="hidden w-full shrink-0 rounded-lg border border-gray-200 bg-white p-5 lg:block lg:w-64 lg:rounded-none lg:border-0 lg:border-r lg:bg-transparent lg:p-0 lg:pr-6"
                    aria-label="Фільтри каталогу">
                    <div class="mb-5 flex items-center justify-between">
                        <h2 class="text-base font-semibold text-gray-900">Фільтри</h2>
                        <button id="clear-filters" type="button" class="text-xs font-medium text-gray-500 underline-offset-2 hover:text-gray-900 hover:underline">
                            Очистити
                        </button>
                    </div>

                    <label for="product-search" class="mb-2 block text-sm font-medium text-gray-700">Пошук</label>
                    <input id="product-search" type="search" placeholder="Назва або бренд"
                        class="mb-6 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none transition focus:border-gray-900 focus:ring-1 focus:ring-gray-900">

                    <div class="mb-6 grid grid-cols-2 gap-2">
                        <input id="price-min" type="number" min="0" placeholder="Від $"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900">
                        <input id="price-max" type="number" min="0" placeholder="До $"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900">
                    </div>

                    <label class="mb-6 flex cursor-pointer items-center gap-2 text-sm text-gray-700">
                        <input id="discount-filter" type="checkbox"
                            class="h-4 w-4 rounded border-gray-300 text-gray-900 focus:ring-gray-900">
                        <span>Зі знижкою</span>
                    </label>

                    <div id="filter-groups" class="space-y-6"></div>
                </aside>

                <div class="min-w-0 flex-1">
                    <div class="mb-5 flex flex-wrap items-center justify-between gap-3 border-b border-gray-200 pb-4">
                        <p id="products-count" class="text-sm text-gray-500"></p>
                        <label class="flex items-center gap-2 text-sm text-gray-600">
                            Сортувати:
                            <select id="sort-products" class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-700 outline-none focus:border-gray-900">
                                <option value="default">За замовчуванням</option>
                                <option value="price-asc">Ціна: від дешевих</option>
                                <option value="price-desc">Ціна: від дорогих</option>
                                <option value="name-asc">Назва: А-Я</option>
                            </select>
                        </label>
                    </div>

                    <div id="products-container" class="flex flex-wrap justify-center -m-4"></div>
                    <p id="empty-products" class="hidden py-16 text-center text-gray-500">За цими параметрами годинників не знайдено.</p>
                </div>
            </div>
        </div>
    </section>

    
    <!-- supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- js -->
    <script src="./js/script.js?v=2"></script>

    <script>
        fetch('./partials/nawbar.html')
            .then(response => response.text())
            .then(data => {
            document.getElementById('navbar').innerHTML = data;
            })
            .catch(error => {
                console.error('Помилка завантаження navbar:', error);
            });
    </script>
    <script src="./js/navbar-search.js"></script>

    <script>
        fetch('./partials/slider.html')
            .then(response => response.text())
            .then(data => {
                const sliderContainer = document.getElementById('slider');
                sliderContainer.innerHTML = data;

                sliderContainer.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.replaceWith(newScript);
                });
            })
            .catch(error => {
                console.error('Помилка завантаження slider:', error);
            });
    </script>

</body>

</html>
