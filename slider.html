<!-- Zafiro Hero Slider -->
<section class="relative w-full overflow-hidden bg-[#f8f5ef]">

    <div
        id="hero-slider"
        class="relative w-full select-none touch-pan-y"
    >

        <div
            id="hero-track"
            class="relative min-h-[380px] sm:min-h-[430px] lg:min-h-[500px]"
        ></div>


        <!-- Previous -->
        <button
            id="hero-prev"
            type="button"
            aria-label="Попередній слайд"
            class="absolute left-3 top-1/2 z-20 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-white/60 text-gray-800 shadow-sm backdrop-blur-sm transition hover:bg-white sm:left-5 sm:h-10 sm:w-10"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 19l-7-7 7-7"
                />
            </svg>
        </button>


        <!-- Next -->
        <button
            id="hero-next"
            type="button"
            aria-label="Наступний слайд"
            class="absolute right-3 top-1/2 z-20 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-white/60 text-gray-800 shadow-sm backdrop-blur-sm transition hover:bg-white sm:right-5 sm:h-10 sm:w-10"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 5l7 7-7 7"
                />
            </svg>
        </button>


        <!-- Dots -->
        <div
            id="hero-dots"
            class="absolute bottom-5 left-1/2 z-20 flex -translate-x-1/2 items-center gap-2"
        ></div>

    </div>

</section>


<script>

const heroSlider = document.getElementById("hero-slider");
const heroTrack = document.getElementById("hero-track");
const heroDots = document.getElementById("hero-dots");

const heroPrev = document.getElementById("hero-prev");
const heroNext = document.getElementById("hero-next");

let heroSlides = [];
let currentHeroSlide = 0;
let heroTimer;

let touchStartX = 0;
let touchStartY = 0;



async function loadHeroSlides() {

    try {

        const response = await fetch("./hero.json");

        if (!response.ok) {
            throw new Error("Не вдалося завантажити hero.json");
        }

        heroSlides = await response.json();

        createHeroSlides();

        showHeroSlide(0);

        startHeroTimer();

    } catch (error) {

        console.error("Помилка завантаження hero:", error);

    }

}




function createHeroSlides() {

    heroTrack.innerHTML = "";
    heroDots.innerHTML = "";


    heroSlides.forEach((slide, index) => {

        const slideElement =
            document.createElement("div");


        slideElement.className = `
            hero-slide
            absolute
            inset-0
            w-full
            min-h-[380px]
            sm:min-h-[430px]
            lg:min-h-[500px]
            opacity-0
            translate-x-full
            pointer-events-none
            transition-all
            duration-700
            ease-in-out
        `;


        slideElement.innerHTML = `

            <div class="absolute inset-0 bg-[#f8f5ef]"></div>


            <div
                class="
                    relative
                    z-10
                    mx-auto
                    flex
                    min-h-[380px]
                    max-w-7xl
                    items-center
                    px-10
                    py-12
                    sm:min-h-[430px]
                    sm:px-16
                    lg:min-h-[500px]
                    lg:px-20
                "
            >

                <!-- TEXT -->

                <div
                    class="
                        z-10
                        w-[58%]
                        max-w-xl
                    "
                >

                    <p
                        class="
                            mb-3
                            text-xs
                            font-medium
                            uppercase
                            tracking-[0.25em]
                            text-gray-500
                            sm:text-sm
                        "
                    >
                        ${slide.subtitle}
                    </p>


                    <h2
                        class="
                            max-w-lg
                            text-3xl
                            font-light
                            leading-tight
                            text-gray-900
                            sm:text-4xl
                            lg:text-6xl
                        "
                    >
                        ${slide.title}
                    </h2>


                    <p
                        class="
                            mt-4
                            max-w-md
                            text-sm
                            leading-6
                            text-gray-600
                            sm:text-base
                        "
                    >
                        ${slide.description}
                    </p>


                    <a
                        href="${slide.buttonLink}"
                        class="
                            mt-6
                            inline-flex
                            items-center
                            rounded-full
                            bg-gray-900
                            px-5
                            py-3
                            text-sm
                            font-medium
                            text-white
                            transition
                            hover:bg-gray-700
                        "
                    >
                        ${slide.buttonText}

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="ml-2 h-4 w-4"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M5 12h14m-6-6l6 6-6 6"
                            />
                        </svg>

                    </a>

                </div>


                <!-- IMAGE -->

                <div
                    class="
                        absolute
                        right-[4%]
                        top-1/2
                        flex
                        h-[85%]
                        w-[46%]
                        -translate-y-1/2
                        items-center
                        justify-center
                        sm:right-[8%]
                        sm:w-[43%]
                        lg:right-[11%]
                        lg:w-[40%]
                    "
                >

                    <img
                        src="${slide.image}"
                        alt="${slide.title}"
                        draggable="false"
                        class="
                            max-h-full
                            max-w-full
                            object-contain
                            drop-shadow-[0_25px_25px_rgba(0,0,0,0.15)]
                        "
                    >

                </div>

            </div>
        `;


        heroTrack.appendChild(slideElement);


        /* DOT */

        const dot =
            document.createElement("button");

        dot.type = "button";

        dot.className = `
            hero-dot
            h-2
            w-2
            rounded-full
            bg-gray-400
            transition-all
            duration-300
        `;

        dot.addEventListener("click", () => {

            showHeroSlide(index);

            restartHeroTimer();

        });

        heroDots.appendChild(dot);

    });

}



function showHeroSlide(index) {

    const slides =
        document.querySelectorAll(".hero-slide");

    const dots =
        document.querySelectorAll(".hero-dot");


    if (!slides.length) {
        return;
    }


    if (index >= slides.length) {
        index = 0;
    }


    if (index < 0) {
        index = slides.length - 1;
    }


    slides.forEach((slide, i) => {

        slide.classList.remove(
            "opacity-100",
            "opacity-0",
            "translate-x-0",
            "translate-x-full",
            "-translate-x-full",
            "pointer-events-none"
        );


        if (i === index) {

            slide.classList.add(
                "opacity-100",
                "translate-x-0"
            );

        } else {

            slide.classList.add(
                "opacity-0",
                "pointer-events-none"
            );


            if (i < index) {

                slide.classList.add(
                    "-translate-x-full"
                );

            } else {

                slide.classList.add(
                    "translate-x-full"
                );

            }

        }

    });


    dots.forEach((dot, i) => {

        if (i === index) {

            dot.classList.remove(
                "w-2",
                "bg-gray-400"
            );

            dot.classList.add(
                "w-7",
                "bg-gray-900"
            );

        } else {

            dot.classList.remove(
                "w-7",
                "bg-gray-900"
            );

            dot.classList.add(
                "w-2",
                "bg-gray-400"
            );

        }

    });


    currentHeroSlide = index;

}




function nextHeroSlide() {

    showHeroSlide(
        currentHeroSlide + 1
    );

}


function prevHeroSlide() {

    showHeroSlide(
        currentHeroSlide - 1
    );

}




function startHeroTimer() {

    clearInterval(heroTimer);

    heroTimer = setInterval(() => {

        nextHeroSlide();

    }, 5000);

}


function restartHeroTimer() {

    startHeroTimer();

}




heroNext.addEventListener("click", () => {

    nextHeroSlide();

    restartHeroTimer();

});


heroPrev.addEventListener("click", () => {

    prevHeroSlide();

    restartHeroTimer();

});




heroSlider.addEventListener(
    "touchstart",
    (event) => {

        touchStartX =
            event.changedTouches[0].screenX;

        touchStartY =
            event.changedTouches[0].screenY;

    },
    { passive: true }
);


heroSlider.addEventListener(
    "touchend",
    (event) => {

        const touchEndX =
            event.changedTouches[0].screenX;

        const touchEndY =
            event.changedTouches[0].screenY;


        const differenceX =
            touchEndX - touchStartX;

        const differenceY =
            touchEndY - touchStartY;


        /* Ігноруємо вертикальний scroll */

        if (
            Math.abs(differenceY) >
            Math.abs(differenceX)
        ) {

            return;

        }


        /* Мінімальна відстань свайпу */

        if (Math.abs(differenceX) < 50) {

            return;

        }


        if (differenceX < 0) {

            nextHeroSlide();

        } else {

            prevHeroSlide();

        }


        restartHeroTimer();

    },
    { passive: true }
);




heroSlider.addEventListener(
    "mouseenter",
    () => {

        clearInterval(heroTimer);

    }
);


heroSlider.addEventListener(
    "mouseleave",
    () => {

        startHeroTimer();

    }
);




loadHeroSlides();

</script>
